<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Reset Password – Sway</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0c0c14;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a28;
      border: 1px solid #252538;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 24px rgba(124,58,237,0.4);
      font-size: 24px;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    p.sub { color: #64748b; font-size: 13px; margin-bottom: 28px; }
    input {
      width: 100%;
      background: #111118;
      border: 1px solid #252538;
      border-radius: 10px;
      padding: 12px 14px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #7c3aed; }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 4px;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: default; }
    .msg { font-size: 13px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; text-align: left; }
    .msg.error   { background: rgba(239,68,68,0.1);  color: #f87171; }
    .msg.success { background: rgba(52,211,153,0.1); color: #6ee7b7; }
    .footer { color: #334155; font-size: 11px; margin-top: 28px; }
    #loading-state { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔑</div>
    <h1>Set New Password</h1>
    <p class="sub" id="subtitle">Choose a new password for your account.</p>

    <div id="loading-state" style="display:none">Verifying reset link…</div>

    <div id="form-state">
      <input type="password" id="password" placeholder="New password (min 8 characters)" autocomplete="new-password"/>
      <input type="password" id="confirm" placeholder="Confirm new password" autocomplete="new-password"/>
      <button id="btn" onclick="doReset()">Update Password</button>
      <div id="msg"></div>
    </div>

    <div id="done-state" style="display:none">
      <div class="msg success">Password updated! You can close this tab and sign in to Sway.</div>
    </div>

    <p class="footer">Sway · by U Brands</p>
  </div>

  <script>
  (function() {
    const SUPABASE_URL = 'https://oijvorghctyucdhnkmtt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9panZvcmdoY3R5dWNkaG5rbXR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NzkxNjEsImV4cCI6MjA5MTE1NTE2MX0.Cef7C4BWvZg760EXU2zWl8yodomcE_iDG5mGRCVnm9Y';
    const { createClient } = window.supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const loadingEl  = document.getElementById('loading-state');
    const formEl     = document.getElementById('form-state');
    const doneEl     = document.getElementById('done-state');
    const subtitleEl = document.getElementById('subtitle');

    loadingEl.style.display = 'block';
    formEl.style.display = 'none';

    let resetDone = false;

    function lockExpired() {
      loadingEl.style.display = 'none';
      formEl.style.display = 'none';
      subtitleEl.textContent = 'This reset link has expired or was already used. Please click "Forgot password?" in the Sway app to request a new one.';
    }

    client.auth.onAuthStateChange((event, session) => {
      if (resetDone) return;
      loadingEl.style.display = 'none';

      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'USER_UPDATED') {
        formEl.style.display = 'block';
      } else if (event === 'INITIAL_SESSION') {
        if (session) {
          formEl.style.display = 'block';
        } else {
          lockExpired();
        }
      }
    });

    // Safety fallback
    setTimeout(() => {
      if (loadingEl.style.display !== 'none') lockExpired();
    }, 8000);

    window.doReset = async function() {
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const msgEl    = document.getElementById('msg');
      const btn      = document.getElementById('btn');

      msgEl.className = 'msg';
      msgEl.textContent = '';

      if (password.length < 8) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (password !== confirm) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Passwords don\'t match.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating…';

      const { error } = await client.auth.updateUser({ password });
      if (error) {
        const msg = error.message || '';
        if (msg.toLowerCase().includes('session') || msg.toLowerCase().includes('token') || msg.toLowerCase().includes('expired')) {
          msgEl.className = 'msg error';
          msgEl.textContent = 'Your session has expired. Please click "Forgot password?" in Sway to request a new reset link.';
          btn.disabled = true;
          btn.textContent = 'Session expired';
          document.getElementById('password').disabled = true;
          document.getElementById('confirm').disabled = true;
        } else {
          msgEl.className = 'msg error';
          msgEl.textContent = error.message;
          btn.disabled = false;
          btn.textContent = 'Update Password';
        }
      } else {
        resetDone = true;
        formEl.style.display = 'none';
        doneEl.style.display = 'block';
      }
    };
  })();
  </script>
</body>
</html>
